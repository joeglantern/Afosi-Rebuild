# /etc/nginx/sites-available/api.afosi.org
#
# CHANGE FROM THE CURRENT LIVE CONFIG: adds the "location /applications" block.
#
# Why: src/api.js and the admin dashboard both post to
# https://api.afosi.org/applications, but only /chat, /img and /donate were
# proxied to the Node service on 127.0.0.1:8790. Everything else fell through
# to "location /" and went to the legacy backend on :8743, which does not know
# these routes, so every application submission returned
# {"success":false,"message":"Route not found"}.
#
# Nothing else in this file changes.

server {
    server_name api.afosi.org;

    location /chat {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /img {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /donate {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── ADDED ────────────────────────────────────────────────────────────────
    # Opportunity applications (server/applications.js on :8790).
    # client_max_body_size matters here: nginx defaults to 1M, which would
    # reject documents well under the service's own 10MB cap and surface as a
    # confusing 413 during upload.
    location /applications {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12M;
        proxy_read_timeout 120s;
    }
    # ── END ADDED ────────────────────────────────────────────────────────────

    location / {
        proxy_pass http://localhost:8743;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.afosi.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.afosi.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.afosi.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.afosi.org;
    return 404; # managed by Certbot
}
