# /etc/nginx/sites-available/afosi.org
#
# CHANGE FROM THE CURRENT LIVE CONFIG: adds security response headers.
#
# The TLS itself was already correct (valid cert covering afosi.org and
# www.afosi.org, complete chain, TLS 1.2/1.3 only, working 80 -> 443 redirect).
# What was missing is Strict-Transport-Security, which is the most likely
# reason some visitors saw "Not secure": without it the browser has no memory
# that this host is HTTPS-only, so typing "afosi.org" or following an old
# http:// link makes a plaintext request first. Chrome's HTTPS-First mode and
# Firefox's HTTPS-Only mode flag exactly that hop.
#
# Nothing else in this file changes.

server {
    server_name afosi.org www.afosi.org;
    root /var/www/afosi-rebuild/dist;
    index index.html;

    # ── ADDED ────────────────────────────────────────────────────────────────
    # "always" makes these apply to error responses too, not just 200s.
    #
    # includeSubDomains is deliberately NOT set yet. It would also bind
    # api.afosi.org and admin.afosi.org (both currently valid HTTPS, so it
    # would work today), but it applies to every present and future subdomain,
    # and a subdomain brought up later without a cert becomes unreachable in
    # any browser that cached the policy. Add it once you are sure every
    # *.afosi.org host is HTTPS. Do not add "preload" unless you intend that
    # to be effectively permanent.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # A Content-Security-Policy is the biggest remaining hardening win, but it
    # will break the site if it is wrong, so it is left commented out. The
    # starting point below reflects what the site actually loads today (Google
    # Fonts, Supabase images via the api.afosi.org proxy, the chat endpoint,
    # and Paystack's checkout). Test it in a browser with the console open
    # before enabling, and re-check after any new third-party script.
    #
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.paystack.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://api.afosi.org https://pmigmljjnyucethipdtk.supabase.co; connect-src 'self' https://api.afosi.org; frame-src https://checkout.paystack.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # ── END ADDED ────────────────────────────────────────────────────────────

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/afosi.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/afosi.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.afosi.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = afosi.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name afosi.org www.afosi.org;
    return 404; # managed by Certbot
}
