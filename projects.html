<body data-page="projects" data-cms="projects">
<div id="af-page" style="background:#FBF6EE;color:#17150F;font-family:'Manrope',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip;">

  <!-- HERO -->
  <section data-section style="max-width:1320px;margin:0 auto;padding:56px 40px 30px;">
    <div style="max-width:900px;animation:rise 0.8s cubic-bezier(.2,.6,.2,1) both;">
      <span style="display:inline-flex;align-items:center;gap:10px;"><span style="width:10px;height:10px;background:#F26522;"></span><span style="font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;white-space:nowrap;color:currentColor;">Programs &amp; Initiatives</span></span>
