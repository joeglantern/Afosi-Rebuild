<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Gallery - AFOSI | Action for Sustainability Initiative</title>
<link rel="icon" type="image/png" href="/assets/afosi/afosi_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="gallery" data-cms="gallery">
<div id="af-page" style="background:#FBF6EE;color:#17150F;font-family:'Manrope',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip;">

  <!-- HERO -->
  <section data-section style="max-width:1320px;margin:0 auto;padding:56px 40px 20px;">
    <div style="max-width:900px;animation:rise 0.8s cubic-bezier(.2,.6,.2,1) both;">
      <span style="display:inline-flex;align-items:center;gap:10px;"><span style="width:10px;height:10px;background:#F26522;"></span><span style="font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;white-space:nowrap;color:currentColor;">Gallery</span></span>
      <h1 data-scramble style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(44px,5.6vw,86px);line-height:1.02;letter-spacing:-0.03em;margin:16px 0 0;">Our visual <em style="font-style:normal;color:#F26522;">story.</em></h1>
      <p style="font-size:20px;line-height:1.6;color:#5A5346;margin:24px 0 0;max-width:640px;">Moments of impact, community and change, captured across our programs, events and partnerships throughout Kenya.</p>
    </div>
  </section>

  <!-- FILTER + MASONRY -->
  <section data-section style="max-width:1320px;margin:0 auto;padding:30px 40px 100px;">
    <div data-filter-group data-reveal style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px;">
      <button data-filter="all" style="cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.04em;padding:9px 18px;border:2px solid #F26522;background:#F26522;color:#141210;transition:all 0.2s;">All</button><button data-filter="Programs" style="cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.04em;padding:9px 18px;border:2px solid #17150F;background:transparent;color:#141210;transition:all 0.2s;">Programs</button><button data-filter="Community" style="cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.04em;padding:9px 18px;border:2px solid #17150F;background:transparent;color:#141210;transition:all 0.2s;">Community</button><button data-filter="Youth" style="cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.04em;padding:9px 18px;border:2px solid #17150F;background:transparent;color:#141210;transition:all 0.2s;">Youth</button><button data-filter="Events" style="cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.04em;padding:9px 18px;border:2px solid #17150F;background:transparent;color:#141210;transition:all 0.2s;">Events</button><button data-filter="Environment" style="cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.04em;padding:9px 18px;border:2px solid #17150F;background:transparent;color:#141210;transition:all 0.2s;">Environment</button>
    </div>
    <div data-gallery-grid style="display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:230px;gap:14px;">
      <!-- Gallery images are rendered from the AFOSI CMS by /src/cms.js. Skeletons below are replaced once that fetch resolves. -->
      <div class="af-skeleton" style="grid-row:span 2;"></div>
      <div class="af-skeleton"></div>
      <div class="af-skeleton"></div>
      <div class="af-skeleton"></div>
      <div class="af-skeleton"></div>
      <div class="af-skeleton" style="grid-row:span 2;"></div>
      <div class="af-skeleton"></div>
      <div class="af-skeleton"></div>
    </div>
    <p style="font-family:'Space Mono',monospace;font-size:12.5px;color:#6E6559;margin-top:22px;text-align:center;">Click any photo to view full size</p>
  </section>

</div>
<script type="module" src="/src/site.js"></script>
<script type="module" src="/src/cms.js"></script>
</body>
</html>
