<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Blog - AFOSI | Action for Sustainability Initiative</title>
<meta name="description" content="Stories, lessons and progress from AFOSI's work with young people building a sustainable Kenya.">
<link rel="icon" type="image/png" href="/assets/afosi/afosi_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="blog" data-cms="blog">
<div id="af-page" style="background:#FBF6EE;color:#17150F;font-family:'Manrope',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip;">

  <!-- HERO -->
  <section data-section style="max-width:1320px;margin:0 auto;padding:56px 40px 30px;">
    <div style="max-width:900px;animation:rise 0.8s cubic-bezier(.2,.6,.2,1) both;">
      <span style="display:inline-flex;align-items:center;gap:10px;"><span style="width:10px;height:10px;background:#F26522;"></span><span style="font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;white-space:nowrap;color:currentColor;">The AFOSI Blog</span></span>
      <h1 data-scramble style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(44px,5.6vw,86px);line-height:1.02;letter-spacing:-0.03em;margin:16px 0 0;">Stories from the <em style="font-style:normal;color:#F26522;">field.</em></h1>
      <p style="font-size:20px;line-height:1.6;color:#5A5346;margin:24px 0 0;max-width:660px;">Voices, lessons and progress from the young people, partners and communities building a sustainable Kenya with AFOSI.</p>
    </div>
  </section>

  <!-- FEATURED (rendered by /src/cms.js when there is a featured story) -->
  <section data-section data-blog-featured-wrap style="max-width:1320px;margin:0 auto;padding:20px 40px 10px;">
    <div data-blog-featured>
      <div class="af-skeleton" style="height:420px;"></div>
    </div>
  </section>

  <!-- FILTERS + SEARCH + GRID -->
  <section data-section style="max-width:1320px;margin:0 auto;padding:40px 40px 100px;">
    <div class="af-blog-toolbar" style="display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;margin-bottom:34px;">
      <div data-blog-cats role="group" aria-label="Filter stories by topic" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
      <form data-blog-search role="search" class="af-blog-search" style="display:flex;align-items:stretch;">
        <label for="af-blog-q" class="af-sr-only">Search stories</label>
        <input id="af-blog-q" name="q" type="search" placeholder="Search stories" autocomplete="off" maxlength="100" style="font-family:'Manrope',system-ui,sans-serif;font-size:15px;font-weight:600;color:#17150F;padding:0 14px;height:46px;min-width:0;width:260px;border:2px solid #17150F;border-right:0;background:#FFFFFF;border-radius:0;outline-offset:2px;">
        <button type="submit" aria-label="Search" class="hov-cta" style="cursor:pointer;width:50px;height:46px;display:flex;align-items:center;justify-content:center;background:#17150F;color:#FBF6EE;border:2px solid #17150F;padding:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
      </form>
    </div>

    <p data-blog-status aria-live="polite" style="font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:0.06em;text-transform:uppercase;color:#6E6559;margin:0 0 22px;min-height:1.6em;"></p>

    <div data-blog-grid style="display:grid;grid-template-columns:repeat(3,1fr);gap:28px;">
      <!-- Story cards are rendered from the AFOSI CMS by /src/cms.js. -->
      <div class="af-skeleton" style="height:430px;"></div>
      <div class="af-skeleton" style="height:430px;"></div>
      <div class="af-skeleton" style="height:430px;"></div>
    </div>

    <div style="display:flex;justify-content:center;margin-top:48px;">
      <button data-blog-more type="button" class="hov-ink" hidden style="cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;padding:15px 30px;border:2px solid #17150F;background:transparent;color:#17150F;">Load more stories</button>
    </div>
  </section>

</div>
<script type="module" src="/src/site.js"></script>
<script type="module" src="/src/cms.js"></script>
</body>
</html>
